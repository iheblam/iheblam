<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 74" width="840" height="74">
<style>text{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace} @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}} .blink{animation:blink 1s steps(1) infinite}
@keyframes flow{to{stroke-dashoffset:-32}} .flow{animation:flow 1s linear infinite}
@keyframes run{from{transform:translateX(-80px)}to{transform:translateX(920px)}} .run{animation:run 3s cubic-bezier(.6,0,.4,1) infinite}
</style>
<defs><filter id="glow" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#ffb800" stop-opacity="0"/><stop offset=".5" stop-color="#ffb800"/><stop offset="1" stop-color="#ffb800" stop-opacity="0"/></linearGradient></defs>
<text x="420" y="32" text-anchor="middle" font-size="26" font-weight="800" letter-spacing="2" fill="#fff" filter="url(#glow)"><tspan fill="#ffb800">❯ </tspan>TRAINING_LOG</text>
<rect class="blink" x="533.2" y="12" width="13" height="24" fill="#ffb800"/>
<text x="294.8" y="31" text-anchor="end" font-size="12" fill="#ffb800" opacity=".7">[04]</text>
<text x="420" y="54" text-anchor="middle" font-size="12" fill="#7f8db3">-- certifications, saved as model checkpoints</text>
<line x1="40" x2="800" y1="68" y2="68" stroke="url(#ln)" stroke-width="2" stroke-dasharray="10 6" class="flow"/>
<rect class="run" x="0" y="65" width="60" height="6" rx="3" fill="#ffb800" filter="url(#glow)"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 250" width="840" height="250">
<style>text{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace} @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}} .blink{animation:blink 1s steps(1) infinite} @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}} .pulse{animation:pulse 1.4s ease-in-out infinite} </style>
<defs>
<radialGradient id="bgr" cx=".5" cy=".35" r=".8"><stop offset="0" stop-color="#0e1838"/><stop offset="1" stop-color="#060a18"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1b2a4a"/></pattern>
<linearGradient id="neon" x1="0" x2="1"><stop offset="0" stop-color="#00e5ff"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff3ea5"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="9s" repeatCount="indefinite"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="card"><rect width="840" height="250" rx="14"/></clipPath></defs>
<g clip-path="url(#card)"><rect width="840" height="250" fill="url(#bgr)"/><rect width="840" height="250" fill="url(#dots)" opacity=".7"/>
<rect width="840" height="34" fill="#080e20"/><line x1="0" x2="840" y1="34" y2="34" stroke="#1b2a4a"/><circle cx="20" cy="17" r="5" fill="#ff5f57"/><circle cx="36" cy="17" r="5" fill="#febc2e"/><circle cx="52" cy="17" r="5" fill="#28c840"/><text x="70" y="21" font-size="12" fill="#7f8db3">iheb@data-lab:~ — zsh</text><text x="28" y="70" font-size="14" opacity="0" xml:space="preserve"><tspan fill="#00ffa3">$ </tspan><tspan fill="#ffffff">python connect.py --target iheb_lamouchi</tspan><set attributeName="opacity" to="1" begin="0.4s" fill="freeze"/></text><text x="28" y="96" font-size="14" opacity="0" xml:space="preserve"><tspan fill="#00e5ff">[INFO] </tspan><tspan fill="#c9d4f2">loading shared interests: AI · RAG · data ...... </tspan><tspan fill="#00ffa3">done</tspan><set attributeName="opacity" to="1" begin="1.4s" fill="freeze"/></text><text x="28" y="122" font-size="14" opacity="0" xml:space="preserve"><tspan fill="#00e5ff">[INFO] </tspan><tspan fill="#c9d4f2">opening socket to a new collaborator .......... </tspan><tspan fill="#00ffa3">done</tspan><set attributeName="opacity" to="1" begin="2.3s" fill="freeze"/></text><text x="28" y="148" font-size="14" opacity="0" xml:space="preserve"><tspan fill="#00ffa3">[ OK ] </tspan><tspan fill="#ffffff">pipeline finished · 0 errors · thanks for scrolling!</tspan><set attributeName="opacity" to="1" begin="3.2s" fill="freeze"/></text><g opacity="0"><set attributeName="opacity" to="1" begin="2.5s" fill="freeze"/><rect x="28" y="168" width="560" height="12" rx="3" fill="#1b2a4a"/><rect x="28" y="168" width="0" height="12" rx="3" fill="url(#neon)"><animate attributeName="width" to="560" begin="2.5s" dur="1.2s" fill="freeze"/></rect><text x="600" y="179" font-size="13" fill="#00ffa3" opacity="0">100%<set attributeName="opacity" to="1" begin="3.7s" fill="freeze"/></text></g><text x="28" y="218" font-size="15" font-weight="700" fill="#ffb800" opacity="0">&gt;&gt;&gt; pick a channel below to connect<set attributeName="opacity" to="1" begin="4.2s" fill="freeze"/></text><rect x="372" y="204" width="10" height="18" fill="#ffb800" opacity="0"><set attributeName="opacity" to="1" begin="4.2s" fill="freeze"/><animate attributeName="fill-opacity" values="1;0;1" dur="1s" calcMode="discrete" repeatCount="indefinite"/></rect>
<rect x="1.5" y="1.5" width="837" height="247" rx="14" fill="none" stroke="url(#neon)" stroke-width="2.5"/></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 180" width="410" height="180">
<style>text{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace} @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}} .blink{animation:blink 1s steps(1) infinite} @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}} .pulse{animation:pulse 1.4s ease-in-out infinite} @keyframes ecg{to{transform:translateX(-71px)}} .ecg{animation:ecg 1.6s linear infinite}@keyframes lap{to{stroke-dashoffset:-100}} .lap{animation:lap 3.5s linear infinite}</style>
<defs>
<radialGradient id="bgr" cx=".5" cy=".35" r=".8"><stop offset="0" stop-color="#0e1838"/><stop offset="1" stop-color="#060a18"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1b2a4a"/></pattern>
<linearGradient id="neon" x1="0" x2="1"><stop offset="0" stop-color="#00e5ff"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff3ea5"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="9s" repeatCount="indefinite"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<radialGradient id="rg" cx="0" cy="1" r="1"><stop offset="0" stop-color="#4da3ff" stop-opacity=".7"/><stop offset="1" stop-color="#4da3ff" stop-opacity="0"/></radialGradient><clipPath id="cc"><rect width="410" height="180" rx="12"/></clipPath></defs>
<g clip-path="url(#cc)"><rect width="410" height="180" fill="url(#bgr)"/><rect width="410" height="180" fill="url(#dots)" opacity=".6"/>
<rect x="16" y="16" width="116" height="20" rx="10" fill="#4da3ff" fill-opacity=".15" stroke="#4da3ff"/>
<circle cx="27" cy="26" r="3.5" fill="#4da3ff" class="pulse"/>
<text x="36" y="30" font-size="10" font-weight="700" fill="#4da3ff" letter-spacing="1">WEB PLATFORM</text>
<text x="22" y="66" font-size="21" font-weight="800" fill="#fff" letter-spacing="1">ESPORT ARENA</text>
<text x="22" y="92" font-size="12" fill="#c9d4f2">Esport tournament arena website,</text><text x="22" y="110" font-size="12" fill="#c9d4f2">split into a frontend and a</text><text x="22" y="128" font-size="12" fill="#c9d4f2">JavaScript backend.</text>
<line x1="22" x2="388" y1="146" y2="146" stroke="#1b2a4a"/>
<text x="22" y="166" font-size="11" fill="#4da3ff">stack: <tspan fill="#fff">HTML · JavaScript</tspan></text>
<text x="388" y="166" font-size="11" fill="#4da3ff" text-anchor="end">inspect <tspan class="blink">→</tspan></text>
<rect x="294" y="14" width="100" height="80" rx="6" fill="#070d1f" stroke="#1b2a4a"/>
<text x="300" y="32" font-size="9" fill="#7f8db3">#1</text><rect x="316" y="24" height="10" rx="2" fill="#4da3ff" opacity="1.00" width="70"><animate attributeName="width" values="70;50;76;70" dur="3.0s" repeatCount="indefinite"/></rect><text x="300" y="49" font-size="9" fill="#7f8db3">#2</text><rect x="316" y="41" height="10" rx="2" fill="#4da3ff" opacity="0.82" width="54"><animate attributeName="width" values="54;34;60;54" dur="3.4s" repeatCount="indefinite"/></rect><text x="300" y="66" font-size="9" fill="#7f8db3">#3</text><rect x="316" y="58" height="10" rx="2" fill="#4da3ff" opacity="0.64" width="40"><animate attributeName="width" values="40;20;46;40" dur="3.8s" repeatCount="indefinite"/></rect><text x="300" y="83" font-size="9" fill="#7f8db3">#4</text><rect x="316" y="75" height="10" rx="2" fill="#4da3ff" opacity="0.46" width="26"><animate attributeName="width" values="26;6;32;26" dur="4.2s" repeatCount="indefinite"/></rect>
<rect x="2" y="2" width="406" height="176" rx="12" fill="none" stroke="#4da3ff" stroke-opacity=".35" stroke-width="1.5"/>
<rect class="lap" x="2" y="2" width="406" height="176" rx="12" fill="none" stroke="#4da3ff" stroke-width="3" pathLength="100" stroke-dasharray="7 93" filter="url(#glow)"/></g></svg>
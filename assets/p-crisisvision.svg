<rect x="300" y="22" width="34" height="20" rx="3" fill="none" stroke="#00e5ff" stroke-width="1.5"/><text x="317" y="36" text-anchor="middle" font-size="9" fill="#00e5ff">IMG</text><rect x="300" y="64" width="34" height="20" rx="3" fill="none" stroke="#ffb800" stroke-width="1.5"/><text x="317" y="78" text-anchor="middle" font-size="9" fill="#ffb800">TXT</text><path id="pa" d="M334 32 C352 32 352 53 364 53" fill="none" stroke="#00e5ff" stroke-opacity=".4"/><path id="pb" d="M334 74 C352 74 352 53 364 53" fill="none" stroke="#ffb800" stroke-opacity=".4"/><circle r="2.5" fill="#00e5ff"><animateMotion dur="1.2s" begin="-0.0s" repeatCount="indefinite"><mpath href="#pa"/></animateMotion></circle><circle r="2.5" fill="#00e5ff"><animateMotion dur="1.2s" begin="-0.4s" repeatCount="indefinite"><mpath href="#pa"/></animateMotion></circle><circle r="2.5" fill="#00e5ff"><animateMotion dur="1.2s" begin="-0.8s" repeatCount="indefinite"><mpath href="#pa"/></animateMotion></circle><circle r="2.5" fill="#ffb800"><animateMotion dur="1.2s" begin="-0.0s" repeatCount="indefinite"><mpath href="#pb"/></animateMotion></circle><circle r="2.5" fill="#ffb800"><animateMotion dur="1.2s" begin="-0.4s" repeatCount="indefinite"><mpath href="#pb"/></animateMotion></circle><circle r="2.5" fill="#ffb800"><animateMotion dur="1.2s" begin="-0.8s" repeatCount="indefinite"><mpath href="#pb"/></animateMotion></circle><circle cx="376" cy="53" r="13" fill="#0b1226" stroke="#00e5ff" stroke-width="2" class="pulse"/><text x="376" y="56" text-anchor="middle" font-size="7" font-weight="700" fill="#00e5ff">CLIP</text>
<rect x="2" y="2" width="406" height="176" rx="12" fill="none" stroke="#00e5ff" stroke-opacity=".35" stroke-width="1.5"/>

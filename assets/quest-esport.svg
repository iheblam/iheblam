<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 180" width="410" height="180">
<style>
text{font-family:'Press Start 2P','Courier New',Courier,monospace}
@keyframes dash{to{stroke-dashoffset:-48}} .border{animation:dash 1.6s linear infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}} .ic{animation:bob 1.2s steps(2) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}} .blink{animation:blink 1s steps(1) infinite}
@keyframes sh{0%,60%{transform:translateX(-200px)}100%{transform:translateX(600px)}} .shine{animation:sh 4s ease-in-out infinite}
</style>
<defs><clipPath id="cc"><rect width="410" height="180" rx="10"/></clipPath>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0b38"/><stop offset="1" stop-color="#0b0420"/></linearGradient>
<linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.4" fill="#000" opacity=".3"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<g clip-path="url(#cc)">
<rect width="410" height="180" fill="url(#bg)"/>
<rect x="14" y="14" width="116" height="20" rx="3" fill="#00f0ff"/>
<text x="22" y="28" font-size="11" font-weight="700" fill="#0b0420" letter-spacing="1">* RARE QUEST</text>
<text x="22" y="62" font-size="21" font-weight="700" fill="#fff" letter-spacing="1">ESPORT ARENA</text>
<text x="22" y="86" font-size="12" fill="#cbb8ff">Esport tournament arena website,</text><text x="22" y="104" font-size="12" fill="#cbb8ff">split into a frontend and a</text><text x="22" y="122" font-size="12" fill="#cbb8ff">JavaScript backend.</text>
<text x="22" y="160" font-size="11" fill="#00f0ff">LOOT: <tspan fill="#fff">HTML  JavaScript</tspan></text>
<text x="388" y="160" font-size="11" fill="#ffe600" text-anchor="end" class="blink">START &gt;</text>
<text x="388" y="102" font-size="10" fill="#00f0ff" text-anchor="end">LV.20</text>
<g class="ic" filter="url(#glow)"><g ><rect x="337" y="33" width="42" height="7" fill="#00f0ff"/><rect x="330" y="40" width="14" height="7" fill="#00f0ff"/><rect x="344" y="40" width="7" height="7" fill="#ffffff"/><rect x="351" y="40" width="35" height="7" fill="#00f0ff"/><rect x="330" y="47" width="7" height="7" fill="#00f0ff"/><rect x="337" y="47" width="21" height="7" fill="#ffffff"/><rect x="358" y="47" width="14" height="7" fill="#00f0ff"/><rect x="372" y="47" width="7" height="7" fill="#ffffff"/><rect x="379" y="47" width="7" height="7" fill="#00f0ff"/><rect x="330" y="54" width="14" height="7" fill="#00f0ff"/><rect x="344" y="54" width="7" height="7" fill="#ffffff"/><rect x="351" y="54" width="14" height="7" fill="#00f0ff"/><rect x="365" y="54" width="7" height="7" fill="#ffffff"/><rect x="372" y="54" width="14" height="7" fill="#00f0ff"/><rect x="330" y="61" width="56" height="7" fill="#00f0ff"/><rect x="330" y="68" width="14" height="7" fill="#00f0ff"/><rect x="372" y="68" width="14" height="7" fill="#00f0ff"/></g></g>
<rect class="shine" x="0" y="0" width="100" height="180" fill="url(#sg)" transform="skewX(-20)"/>
<rect width="410" height="180" fill="url(#scan)"/>
<rect class="border" x="2" y="2" width="406" height="176" rx="10" fill="none" stroke="#00f0ff" stroke-width="3" stroke-dasharray="36 12"/>
</g></svg>